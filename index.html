<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Simple Carousel 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="carousel-container">
    <div class="carousel-slide" id="slide">
        <!-- 1枚目 -->
        <div class="item">
            <a href="https://example.com/link1" target="_top">
                <img src="images/image1.jpg" alt="Slide 1">
            </a>
        </div>
        <!-- 2枚目 -->
        <div class="item">
            <a href="https://example.com/link2" target="_top">
                <img src="images/image2.jpg" alt="Slide 2">
            </a>
        </div>
        <!-- 3枚目 -->
        <div class="item">
            <a href="https://example.com/link3" target="_top">
                <img src="images/image3.jpg" alt="Slide 3">
            </a>
        </div>
    </div>

    <!-- ボタン -->
    <button class="prev-btn" id="prev"><b>←</b></button>
    <button class="next-btn" id="next"><b>→</b></button>
</div>

<script src="script.js"></script>
</body>
</html>
