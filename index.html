<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Simple Carousel 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="carousel-container">
    <div class="carousel-slide" id="slide">
        <div class="item"><img src="images/image1.jpg" alt="Slide 1"></div>
        <div class="item"><img src="images/image2.jpg" alt="Slide 2"></div>
        <div class="item"><img src="images/image3.jpg" alt="Slide 3"></div>
    </div>

    <!-- ボタン -->
    <button class="prev-btn" id="prev">prev</button>
    <button class="next-btn" id="next">next</button>
</div>

<script src="script.js"></script>
</body>
</html>
